services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: budgetplanner_backend
    hostname: budgetplanner_backend
    expose:
      - '8000'
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: budgetplanner_frontend
    hostname: budgetplanner_frontend
    ports:
      - '8011:80'
    depends_on:
      - backend
    restart: unless-stopped
